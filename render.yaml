services:
  - type: web
    name: hydroguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hydroguard-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: hydroguard-db
    plan: free
    region: oregon
    databaseName: hydroguard
    user: hydroguard_user
